name: Configure Telegram Mini App
on: workflow_dispatch
permissions: {}
jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Configure menu and welcome
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          def api(method, data):
              request = urllib.request.Request('https://api.telegram.org/bot'+os.environ['BOT_TOKEN']+'/'+method,data=json.dumps(data).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(request,timeout=20) as response:
                      return json.load(response)['result']
              except urllib.error.HTTPError as error:
                  raise SystemExit(method+' failed: HTTP '+str(error.code))
              except OSError:
                  raise SystemExit(method+' network error')
          print('Bot: @'+api('getMe',{})['username'])
          menu={'type':'web_app','text':'Читать','web_app':{'url':'https://ulikashi.github.io/between_lines/'}}
          greeting='Добро пожаловать в «Между строк»! Вера приехала к морю на месяц. У двери съёмной квартиры её уже ждёт человек со вторым ключом. Нажми «Читать», чтобы открыть историю и выбрать, что Вера скажет первой.'
          api('setChatMenuButton',{'menu_button':menu})
          api('setMyDescription',{'description':greeting})
          assert api('getChatMenuButton',{})==menu
          assert api('getMyDescription',{})['description']==greeting
          PY
